name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Check runtime and script syntax
        run: |
          node scripts/check-node-version.cjs
          for script in scripts/*.mjs; do node --check "$script"; done
          bash -n install.sh
